[project]
name = "repo-necromancer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.1",
  "pip-audit>=2.10",
  "ruff>=0.6",
  "pyyaml>=6",
  "packaging>=24",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 100
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
