[project]
name = "repo-necromancer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "sqlalchemy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures"]

[tool.ruff]
line-length = 100
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
